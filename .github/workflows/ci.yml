name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  check:
    name: Compilazione e import
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # La ROM non e' nel repo: si verifica solo che il codice compili e si importi
      - name: Compile and import
        run: |
          python -m compileall -q main.py agent
          python -c "import agent.env, agent.train, agent.play"
          python main.py --help
